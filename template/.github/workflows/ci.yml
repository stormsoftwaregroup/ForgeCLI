name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint

  test-server:
    name: Server Tests
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: unicornforged
          POSTGRES_PASSWORD: unicornforged
          POSTGRES_DB: forge_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U unicornforged"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://unicornforged:unicornforged@localhost:5432/forge_template_test
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npx prisma db seed
        working-directory: server
      - run: npm test

  test-e2e:
    name: E2E Tests
    needs: test-server
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: unicornforged
          POSTGRES_PASSWORD: unicornforged
          POSTGRES_DB: forge_template
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U unicornforged"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://unicornforged:unicornforged@localhost:5432/forge_template
      NODE_ENV: development
      JWT_SECRET: ci-test-jwt-secret
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npx prisma db seed
        working-directory: server
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build -w client
