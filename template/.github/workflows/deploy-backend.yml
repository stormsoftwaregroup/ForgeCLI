name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy:
    name: Build, Test & Deploy to Azure App Service
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: unicornforged
          POSTGRES_PASSWORD: unicornforged
          POSTGRES_DB: forge_template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U unicornforged"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://unicornforged:unicornforged@localhost:5432/forge_template_test
      NODE_ENV: test
      JWT_SECRET: ci-test-jwt-secret
      REFRESH_TOKEN_SECRET: ci-test-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
        working-directory: server
      - run: npx prisma db seed
        working-directory: server
      - run: npm test

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_APP_SERVICE_NAME }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: server
